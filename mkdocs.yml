site_name: WOAH Data Science Wiki
site_description: Shared Data Science knowledge for everyone
site_url: !ENV [WIKI_SITE_URL, "http://localhost:8000/"]
docs_dir: content
site_dir: site
use_directory_urls: true

nav:
  - Home: index.md
  - Getting started: pages/getting-started.md
  - Tools and recipes: pages/tools-and-recipes.md
  - Resources: pages/resources.md

theme:
  name: material
  language: en
  logo: assets/woah-mark-white.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - assets/brand.css
  - assets/edit-button.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/edit-button.js

copyright: World Organisation for Animal Health
