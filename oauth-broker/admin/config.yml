backend:
  name: github
  repo: simo-berrada/wiki
  branch: main
  # Log in via our own function on this same Netlify site (same-origin), so the
  # GitHub login works even in locked-down corporate browsers.
  base_url: https://iridescent-quokka-3f9b9b.netlify.app
  auth_endpoint: .netlify/functions/auth

publish_mode: simple
site_url: https://simo-berrada.github.io/wiki/
display_url: https://simo-berrada.github.io/wiki/
media_folder: content/media
public_folder: /wiki/media

collections:
  - name: pages
    label: Pages
    description: The wiki pages. Pick a page and edit it.
    files:
      - name: home
        label: Home
        file: content/index.md
        fields:
          - { label: Page content, name: body, widget: markdown }
      - name: getting-started
        label: Getting started
        file: content/pages/getting-started.md
        fields:
          - { label: Page content, name: body, widget: markdown }
      - name: tools-and-recipes
        label: Tools and recipes
        file: content/pages/tools-and-recipes.md
        fields:
          - { label: Page content, name: body, widget: markdown }
      - name: resources
        label: Resources
        file: content/pages/resources.md
        fields:
          - { label: Page content, name: body, widget: markdown }
