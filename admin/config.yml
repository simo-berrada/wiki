backend:
  name: github
  repo: REPLACE_WITH_GITHUB_REPOSITORY
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: REPLACE_WITH_DECAP_SITE_DOMAIN

publish_mode: simple
site_url: REPLACE_WITH_SITE_URL
display_url: REPLACE_WITH_SITE_URL
logo_url: REPLACE_WITH_SITE_URLassets/images/favicon.png
media_folder: content/media
public_folder: REPLACE_WITH_MEDIA_PATH

collections:
  - name: pages
    label: Pages
    description: The wiki pages. Pick a page and edit it.
    files:
      - name: home
        label: Home
        file: content/index.md
        fields:
          - { label: Page content, name: body, widget: markdown }
      - name: getting-started
        label: Getting started
        file: content/pages/getting-started.md
        fields:
          - { label: Page content, name: body, widget: markdown }
      - name: tools-and-recipes
        label: Tools and recipes
        file: content/pages/tools-and-recipes.md
        fields:
          - { label: Page content, name: body, widget: markdown }
      - name: resources
        label: Resources
        file: content/pages/resources.md
        fields:
          - { label: Page content, name: body, widget: markdown }
